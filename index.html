<!doctype html><html lang='el'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Πρόγραμμα ιερών ακολουθιών ιερού ενοριακού Ναού Παναγίας Ακαθίστου Ύμνου Οίας "Παναγία Πλατσανή"</title><link rel='stylesheet' href='style.css?v=4'>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "930afb48-3d13-4539-8197-c81f61e7e154",

    serviceWorkerPath: "OneSignalSDKWorker.js",
    serviceWorkerUpdaterPath: "OneSignalSDKUpdaterWorker.js",

    notifyButton: {
      enable: true
    }
  });
});
</script>

</head><body><div class='container'><h1>Πρόγραμμα ιερών ακολουθιών ιερού ενοριακού ναού Παναγίας Ακαθίστου Ύμνου Οίας "Παναγία Πλατσανή"</h1><p><a class='btn' href='calendar.ics'>📅 Προσθήκη στο Ημερολόγιο</a><button id='installBtn' class='btn secondary' type='button'>📱 Προσθήκη στην Αφετηρία</button></p><ul id='events'></ul>
<div id="installHelp" class="install-help" hidden>
  <div class="install-card" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <button id="closeInstall" class="install-close" type="button" aria-label="Κλείσιμο">×</button>
    <div class="install-icon">📱</div>
    <h2 id="installTitle">Προσθήκη στην Αφετηρία</h2>
    <p>Στο iPhone:</p>
    <ol>
      <li>Πάτησε <strong>Κοινοποίηση</strong> ↗ στο Safari.</li>
      <li>Επίλεξε <strong>«Προσθήκη στην Αφετηρία»</strong>.</li>
      <li>Πάτησε <strong>«Προσθήκη»</strong>.</li>
    </ol>
    <button id="closeInstall2" class="btn" type="button">Εντάξει</button>
  </div>
</div>
<script>
(function(){
  const btn=document.getElementById('installBtn');
  const help=document.getElementById('installHelp');
  const close1=document.getElementById('closeInstall');
  const close2=document.getElementById('closeInstall2');
  if(!btn||!help) return;
  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(standalone) btn.hidden=true;
  const close=()=>help.hidden=true;
  btn.addEventListener('click',()=>help.hidden=false);
  close1.addEventListener('click',close);
  close2.addEventListener('click',close);
  help.addEventListener('click',e=>{if(e.target===help)close()});
})();
</script>
<script src='script.js?v=4'></script></div></body></html>
