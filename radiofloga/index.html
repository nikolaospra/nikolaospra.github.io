<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#641f24"
    >

    <title>Ράδιο Φλόγα - Ενορία Οίας</title>
<meta property="og:type" content="website">

<meta
    property="og:title"
    content="Ράδιο Φλόγα - Ενορία Οίας"
>

<meta
    property="og:description"
    content="Συνδεθείτε με το Ορθόδοξο Ραδιόφωνο της Ενορίας Οίας."
>

<meta
    property="og:image"
    content="https://oiachurch.gr/church.jpg"
>

<meta
    property="og:url"
    content="https://oiachurch.gr/radiofloga/"
>

<meta
    property="og:site_name"
    content="Ενορία Οίας"
>

<meta
    name="twitter:card"
    content="summary_large_image"
>

<meta
    name="twitter:image"
    content="https://oiachurch.gr/church.jpg"
>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #f6f1e8 0%,
                    #eee5d8 100%
                );

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #2f2925;
        }

        .radio-page {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .radio-logo {
            font-size: 58px;
            margin-bottom: 8px;
        }

        .radio-heading {
            margin: 0 0 6px;
            color: #641f24;
            font-size: 28px;
            font-weight: 800;
        }

        .radio-subtitle {
            margin-bottom: 28px;
            color: #756d65;
            font-size: 15px;
        }

        .radio-player {

            width: 100%;
            padding: 25px 22px;

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    #702727 0%,
                    #541c1c 100%
                );

            color: #fff;

            box-shadow:
                0 14px 32px
                rgba(70, 25, 25, 0.22);
        }

        .radio-player-title {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .radio-player-controls {

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 14px;
        }

        .radio-player-controls button {

            width: 56px;
            height: 56px;

            flex: 0 0 56px;

            border: 0;
            border-radius: 50%;

            background:
                rgba(255,255,255,.14);

            color: #fff;

            font-size: 21px;
            font-weight: 700;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;
        }

        .radio-player-controls button:active {
            transform: scale(.95);
        }

        .radio-player-controls button:disabled {
            cursor: default;
        }

        .radio-info {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        #radioStatus {
            font-size: 15px;
            font-weight: 700;
        }

        .radio-live {

            margin-top: 6px;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .radio-back {

            display: inline-block;

            margin-top: 24px;

            color: #641f24;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;
        }

    </style>

</head>


<body>

    <main class="radio-page">

        <div class="radio-logo">
            📻
        </div>

        <h1 class="radio-heading">
            Ράδιο Φλόγα
        </h1>

        <div class="radio-subtitle">
            Ενορία Οίας
        </div>


        <div class="radio-player">

            <div class="radio-player-title">
                📻 ΡΑΔΙΟ ΦΛΟΓΑ
            </div>


            <div class="radio-player-controls">

                <button
                    id="radioPlay"
                    type="button"
                    aria-label="Αναπαραγωγή"
                >
                    ▶
                </button>


                <div class="radio-info">

                    <div id="radioStatus">
                        Πατήστε ▶ για ακρόαση
                    </div>

                    <div class="radio-live">
                        🔴 LIVE
                    </div>

                </div>


                <button
                    id="radioMute"
                    type="button"
                    aria-label="Σίγαση"
                >
                    🔊
                </button>

            </div>


            <audio
                id="radioAudio"
                preload="none"
                src="https://late-paper-b3de.nikolaos-pra.workers.dev">
            </audio>

        </div>


        <a
            class="radio-back"
            href="https://oiachurch.gr/"
        >
            ← Επιστροφή στην Ενορία Οίας
        </a>

    </main>


    <script>

        const radioAudio =
            document.getElementById('radioAudio');

        const radioPlay =
            document.getElementById('radioPlay');

        const radioMute =
            document.getElementById('radioMute');

        const radioStatus =
            document.getElementById('radioStatus');

        let radioLoading = false;


        radioPlay.addEventListener(
            'click',
            async () => {

                if (radioLoading) {
                    return;
                }


                if (radioAudio.paused) {

                    radioLoading = true;

                    radioPlay.disabled = true;

                    radioPlay.style.opacity = '0.6';


                    radioStatus.textContent =
                        'Σύνδεση με το Ράδιο Φλόγα...';


                    try {

                        await radioAudio.play();


                        radioPlay.textContent =
                            '❚❚';


                        radioStatus.textContent =
                            'Αναπαραγωγή Ράδιο Φλόγα';


                    } catch (error) {

                        radioPlay.textContent =
                            '▶';


                        radioStatus.textContent =
                            'Δεν ήταν δυνατή η σύνδεση με το ραδιόφωνο.';

                    }


                    radioLoading = false;

                    radioPlay.disabled = false;

                    radioPlay.style.opacity = '1';


                } else {

                    radioAudio.pause();


                    radioPlay.textContent =
                        '▶';


                    radioStatus.textContent =
                        'Πατήστε ▶ για ακρόαση';

                }

            }
        );


        radioMute.addEventListener(
            'click',
            () => {

                radioAudio.muted =
                    !radioAudio.muted;


                radioMute.textContent =
                    radioAudio.muted
                        ? '🔇'
                        : '🔊';

            }
        );

    </script>

</body>

</html>
